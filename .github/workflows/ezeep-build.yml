name: ezeep Build

# Builds the hardened controller images and pushes them to the ezeep Azure
# Container Registry (<login server>/ezeep/...). Derived from release-head.yml,
# but does not run the unit/e2e suites (pr.yaml covers those).
#
# Authenticates with GitHub OIDC (no stored secret) as the app registration
# "github-oidc-ezeep-ingress-nginx", which has AcrPush on the registry and a
# federated credential for this repository's ezeep-build branch only.
# Optional variables: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID and
# ACR_LOGIN_SERVER override the defaults below.
on:
  push:
    branches:
      - ezeep-build
  workflow_dispatch: {}

permissions:
  contents: read

env:
  ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER || 'ezeep20dev.azurecr.io' }}
  IMAGE_PREFIX: ${{ vars.ACR_LOGIN_SERVER || 'ezeep20dev.azurecr.io' }}/ezeep
  AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID || '72e6cdc2-2d3e-4776-adc6-e0930b4e1fab' }}
  AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID || '64d5a305-62c8-419e-a69f-cf5053f9d5de' }}
  AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID || '661c04ac-d727-4138-9abe-81103faa1e38' }}

concurrency:
  group: ezeep-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  meta:
    permissions:
      contents: read
      id-token: write # Azure OIDC login
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      branch_tag: ${{ steps.meta.outputs.branch_tag }}
    steps:
    - name: Check out code
      uses: actions/checkout@v7

    # Fail fast on registry access instead of after the long base image build
    - name: Azure login (OIDC)
      uses: azure/login@v2
      with:
        client-id: ${{ env.AZURE_CLIENT_ID }}
        tenant-id: ${{ env.AZURE_TENANT_ID }}
        subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

    - name: Login to ACR
      run: az acr login --name "${ACR_LOGIN_SERVER%%.*}"

    - name: Compute tags
      id: meta
      run: |
        # Immutable tag, e.g. v1.15.1-abc1234
        echo "version=$(cat TAG)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
        # Moving tag named after the branch, e.g. ezeep-build
        echo "branch_tag=$(echo "${GITHUB_REF_NAME}" | tr -c 'A-Za-z0-9_.\n-' '-')" >> "$GITHUB_OUTPUT"

  build-base-image:
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
    - name: Check out code
      uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build base image cache (${{ matrix.arch }})
      uses: docker/build-push-action@v7
      with:
        context: ./images/nginx/rootfs
        platforms: linux/${{ matrix.arch }}
        cache-from: type=gha,scope=nginx-base-${{ matrix.arch }}-${{ github.ref_name }}
        cache-to: type=gha,scope=nginx-base-${{ matrix.arch }}-${{ github.ref_name }},mode=min

  build-binary:
    needs: meta
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
    - name: Check out code
      uses: actions/checkout@v7

    - name: Build Binary
      env:
        ARCH: ${{ matrix.arch }}
        TAG: ${{ needs.meta.outputs.version }}
      run: ./scripts/build-binary

    - name: Upload Binary
      uses: actions/upload-artifact@v7
      with:
        name: binaries-${{ matrix.arch }}
        path: rootfs/bin/${{ matrix.arch }}
        retention-days: 2

  build-certgen:
    needs: meta
    permissions:
      contents: read
      id-token: write # Azure OIDC login
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@v7

    - name: Azure login (OIDC)
      uses: azure/login@v2
      with:
        client-id: ${{ env.AZURE_CLIENT_ID }}
        tenant-id: ${{ env.AZURE_TENANT_ID }}
        subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

    - name: Login to ACR
      run: az acr login --name "${ACR_LOGIN_SERVER%%.*}"

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Get certgen build args
      run: |
        echo "KWC_BASE_IMAGE=$(cat NGINX_BASE)" >> $GITHUB_ENV
        echo "KWC_GOLANG_VERSION=$(cat GOLANG_VERSION)" >> $GITHUB_ENV

    - name: Build and push kube-webhook-certgen image
      uses: docker/build-push-action@v7
      with:
        context: ./images/kube-webhook-certgen/rootfs
        platforms: linux/amd64,linux/arm64
        push: true
        tags: |
          ${{ env.IMAGE_PREFIX }}/kube-webhook-certgen:${{ needs.meta.outputs.version }}
          ${{ env.IMAGE_PREFIX }}/kube-webhook-certgen:${{ needs.meta.outputs.branch_tag }}
        build-args: |
          BASE_IMAGE=${{ env.KWC_BASE_IMAGE }}
          GOLANG_VERSION=${{ env.KWC_GOLANG_VERSION }}
        labels: |
          org.opencontainers.image.description=Ingress NGINX kube-webhook-certgen
          org.opencontainers.image.source=https://github.com/${{ github.repository }}
          org.opencontainers.image.licenses=Apache-2.0

  build-controller-image:
    needs: [meta, build-base-image, build-binary]
    permissions:
      contents: read
      id-token: write # Azure OIDC login
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@v7

    - name: Download Binaries
      uses: actions/download-artifact@v8
      with:
        pattern: binaries-*
        path: ./bin

    - name: Setup binaries in correct location, fix permissions
      run: |
        mkdir -p ./rootfs/bin
        mv ./bin/binaries-amd64 ./rootfs/bin/amd64
        mv ./bin/binaries-arm64 ./rootfs/bin/arm64
        chmod +x ./rootfs/bin/amd64/* ./rootfs/bin/arm64/*

    - name: Azure login (OIDC)
      uses: azure/login@v2
      with:
        client-id: ${{ env.AZURE_CLIENT_ID }}
        tenant-id: ${{ env.AZURE_TENANT_ID }}
        subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

    - name: Login to ACR
      run: az acr login --name "${ACR_LOGIN_SERVER%%.*}"

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    # Assembles the multi-arch base image from the per-arch caches built above
    - name: Build base image OCI layout (cached)
      uses: docker/build-push-action@v7
      with:
        context: ./images/nginx/rootfs
        platforms: linux/amd64,linux/arm64
        cache-from: |
          type=gha,scope=nginx-base-amd64-${{ github.ref_name }}
          type=gha,scope=nginx-base-arm64-${{ github.ref_name }}
        outputs: type=oci,dest=base.oci,tar=false

    - name: Build and push controller image
      uses: docker/build-push-action@v7
      with:
        context: ./rootfs
        file: ./rootfs/Dockerfile
        platforms: linux/amd64,linux/arm64
        push: true
        tags: |
          ${{ env.IMAGE_PREFIX }}/nginx-ingress-controller:${{ needs.meta.outputs.version }}
          ${{ env.IMAGE_PREFIX }}/nginx-ingress-controller:${{ needs.meta.outputs.branch_tag }}
        build-contexts: |
          base=oci-layout://${{ github.workspace }}/base.oci
        build-args: |
          BASE_IMAGE=base
          VERSION=${{ needs.meta.outputs.version }}
          COMMIT_SHA=${{ github.sha }}
          BUILD_ID=${{ github.run_id }}
        labels: |
          org.opencontainers.image.source=https://github.com/${{ github.repository }}
        sbom: true
        provenance: mode=max

    - name: Build and push controller chroot image
      uses: docker/build-push-action@v7
      with:
        context: ./rootfs
        file: ./rootfs/Dockerfile-chroot
        platforms: linux/amd64,linux/arm64
        push: true
        tags: |
          ${{ env.IMAGE_PREFIX }}/nginx-ingress-controller-chroot:${{ needs.meta.outputs.version }}
          ${{ env.IMAGE_PREFIX }}/nginx-ingress-controller-chroot:${{ needs.meta.outputs.branch_tag }}
        build-contexts: |
          base=oci-layout://${{ github.workspace }}/base.oci
        build-args: |
          BASE_IMAGE=base
          VERSION=${{ needs.meta.outputs.version }}
          COMMIT_SHA=${{ github.sha }}
          BUILD_ID=${{ github.run_id }}
        labels: |
          org.opencontainers.image.source=https://github.com/${{ github.repository }}
        sbom: true
        provenance: mode=max
